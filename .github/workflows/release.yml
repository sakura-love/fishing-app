name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # Accept Android SDK licenses
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build APK (local)
        run: |
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleRelease
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/钓鱼人宝典-v${{ steps.version.outputs.version }}.apk"

      - name: Generate changelog
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "$CURRENT^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            git log "$PREV..$CURRENT" --pretty=format:"- %s (%h)" --no-merges > cl.txt
          else
            git log --pretty=format:"- %s (%h)" --no-merges > cl.txt
          fi
          echo "## $CURRENT" | cat - cl.txt > CHANGELOG_TEMP.md

      - uses: softprops/action-gh-release@v2
        with:
          name: "钓鱼人宝典 ${{ github.ref_name }}"
          body_path: CHANGELOG_TEMP.md
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
